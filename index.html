<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songbook</title>
<meta name="description" content="My songbook: chords over lyrics, playing along, speed and pitch.">
<meta name="theme-color" content="#181825">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songbook">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<script>
  // Set the theme before the first paint: "auto" follows the system, with
  // Mocha for dark and Latte for light.
  (function () {
    var pref = "auto";
    try { pref = localStorage.getItem("songbook-theme") || "auto"; } catch (e) { /* blocked */ }
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = pref === "mocha" || pref === "latte" ? pref : (dark ? "mocha" : "latte");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="main">
    <section id="view-songs" class="view" aria-label="Songs"></section>
    <section id="view-practice" class="view hidden" aria-label="Practice"></section>
    <section id="view-settings" class="view hidden" aria-label="Settings"></section>
    <section id="view-song" class="view song-view hidden" aria-label="Song"></section>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <a class="tab" href="#/songs" data-tab="songs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
      <span>Songs</span>
    </a>
    <a class="tab" href="#/practice" data-tab="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span>Practice</span>
    </a>
    <a class="tab" href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </a>
  </nav>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
